name: HebrewApp

# Reproducible generation: `xcodegen generate` (XcodeGen 2.45.4, see Documentation/IMPLEMENTATION_STATUS.md).
# The generated HebrewApp.xcodeproj is committed so the project opens directly without requiring XcodeGen.
# Bundle identifier prefix uses the RFC 2606 reserved "example" domain as an explicit placeholder —
# no real company/team is invented. Replace before any real distribution (see DECISIONS.md addendum).

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  useBaseInternationalization: false
  postGenCommand: ""

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  HebrewApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HebrewApp
      - path: Content/Pilot
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hebrewapp
        PRODUCT_NAME: HebrewApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: HebrewApp
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Die Mikrofonaufnahme wird nur verwendet, wenn du in einer Sprechübung selbst aufnimmst. Ohne Erlaubnis funktionieren Lese- und Hörübungen weiterhin."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Die lokale Spracherkennung läuft ausschließlich auf diesem Gerät und wird nur genutzt, um deine Aufnahme mit dem Zieltext zu vergleichen. Es werden keine Audiodaten an einen Server gesendet."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    entitlements:
      path: Generated/HebrewApp.entitlements
      properties: {}

  HebrewAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HebrewAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hebrewapp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HebrewApp

  HebrewAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HebrewAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hebrewapp.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HebrewApp

schemes:
  HebrewApp:
    build:
      targets:
        HebrewApp: [run, test, profile, analyze, archive]
        HebrewAppTests: [test]
        HebrewAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HebrewAppTests
        - HebrewAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
